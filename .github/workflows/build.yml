name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04: python-for-android's libffi recipe fails on 24.04
    # (autoconf 2.72 -> LT_SYS_SYMBOL_USCORE / LIBFFI_ENABLE_SYMVERS errors).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev build-essential

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Clone and patch p4a
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git /home/runner/p4a
          python - <<'PY'
          path = "/home/runner/p4a/pythonforandroid/build.py"
          src = open(path).read()
          before = "pip install -U pip"
          after = "python -m pip install -U pip"
          if before not in src:
              raise SystemExit("target string not found in " + path)
          open(path, "w").write(src.replace(before, after))
          print("patched", path)
          PY

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-apk
          path: bin/*.apk
