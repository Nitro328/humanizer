name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04: python-for-android's libffi recipe fails on 24.04
    # (autoconf 2.72 -> LT_SYS_SYMBOL_USCORE / LIBFFI_ENABLE_SYMVERS errors).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev build-essential

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Cache buildozer and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-apk
          path: bin/*.apk
